const container = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(60, container.clientWidth/container.clientHeight, 0.001, 100);
camera.position.set(0.6, -0.6, 0.6);
camera.up.set(0, 0, 1);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

scene.add(new THREE.AxesHelper(0.15));
const grid = new THREE.GridHelper(1, 10, 0xaaaaaa, 0xdddddd);
grid.rotation.x = Math.PI/2;
scene.add(grid);

let zmin=Infinity, zmax=-Infinity;
for (const p of POINTS) { if(p[2]<zmin) zmin=p[2]; if(p[2]>zmax) zmax=p[2]; }
const positions = new Float32Array(POINTS.length*3);
const colors = new Float32Array(POINTS.length*3);
for (let i=0;i<POINTS.length;i++){
  positions[i*3]=POINTS[i][0]; positions[i*3+1]=POINTS[i][1]; positions[i*3+2]=POINTS[i][2];
  const t = (zmax>zmin) ? (POINTS[i][2]-zmin)/(zmax-zmin) : 0.5;
  colors[i*3]=0.85*t+0.05; colors[i*3+1]=0.15; colors[i*3+2]=0.85*(1-t)+0.05;
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions,3));
geom.setAttribute('color', new THREE.BufferAttribute(colors,3));
const mat = new THREE.PointsMaterial({size:0.004, vertexColors:true});
scene.add(new THREE.Points(geom, mat));

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0,0,0);

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth/container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
